<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Messi GOAT Collection</title>
<style>
:root{--bg:#07101c;--panel:#102036;--panel2:#142942;--text:#f7fbff;--muted:#9eb1c9;--line:#ffffff18;--gold:#f2c14e;--green:#5ed39a;--blue:#7d70ff;--red:#ff7b87}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#153455 0,#07101c 42%);color:var(--text);font:14px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1180px;margin:auto;padding:22px}.hero{padding:34px 22px 18px}.hero h1{font-size:clamp(30px,6vw,58px);line-height:1;margin:0 0 12px}.hero p{color:var(--muted);max-width:760px}.badge{display:inline-flex;padding:5px 10px;border:1px solid #ffffff24;border-radius:999px;background:#ffffff0c;color:#dce9f8;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.stat{background:#ffffff0b;border:1px solid var(--line);border-radius:16px;padding:14px}.stat b{display:block;font-size:22px}.stat span{color:var(--muted);font-size:12px}.toolbar{position:sticky;top:0;z-index:5;background:#07101ce8;backdrop-filter:blur(14px);border-block:1px solid var(--line)}.controls{max-width:1180px;margin:auto;padding:12px 22px;display:grid;grid-template-columns:1fr 180px 180px;gap:8px}input,select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid #ffffff25;background:#12243a;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}.card{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 14px 36px #0004}.visual{height:180px;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;background:linear-gradient(135deg,#295f91,#142335 60%,#201b38);position:relative}.visual:after{content:"CARD IMAGE READY";position:absolute;bottom:10px;right:12px;color:#ffffff6b;font-size:10px;letter-spacing:.15em}.visual strong{font-size:23px;max-width:260px}.body{padding:16px}.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.tier{min-width:38px;text-align:center;font-weight:800;border-radius:999px;padding:5px 9px;background:var(--blue)}.tier.S{background:var(--gold);color:#17120a}.tier.A{background:var(--green);color:#07140f}.tier.B{background:#4f8ee8}.year{color:var(--muted);font-size:12px}.body h2{font-size:19px;line-height:1.25;margin:7px 0 4px}.full{color:#c7d6e7;font-size:12px}.score{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:14px 0}.score div{background:#ffffff09;border:1px solid #ffffff0b;border-radius:10px;padding:7px 4px;text-align:center;font-size:10px}.score b{display:block;font-size:15px}.market{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.market div{background:#07101c80;border-radius:10px;padding:9px}.market span{display:block;color:var(--muted);font-size:10px}.market b{font-size:12px}.advice{margin:12px 0;padding:10px 12px;border-left:3px solid var(--green);background:#5ed39a0b;border-radius:8px}.advice.warn{border-color:var(--gold);background:#f2c14e0b}.story{color:#b8c8da;font-size:12px;min-height:58px}.links{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:12px}.links a{color:#fff;text-decoration:none;text-align:center;padding:9px;border-radius:10px;background:#ffffff0d;border:1px solid #ffffff12;font-size:12px}.links a:hover{background:#ffffff1a}.empty{text-align:center;color:var(--muted);padding:50px}.note{margin-top:24px;padding:15px;border-radius:14px;background:#ffffff08;color:var(--muted);font-size:12px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.hero{padding-top:25px}.visual{height:160px}}
</style>
</head>
<body>
<header class="wrap hero">
<span class="badge">GOAT COLLECTION · MARKET DASHBOARD</span>
<h1>Lionel Messi 收藏資料庫</h1>
<p>以歷史意義、美感、稀有度與流動性整理。價格為市場觀察區間，不是即時報價；買入前請交叉確認實際成交。</p>
<div class="stats"><div class="stat"><b id="count">8</b><span>精選卡片</span></div><div class="stat"><b>3</b><span>GOAT Core</span></div><div class="stat"><b>5</b><span>市場查價來源</span></div><div class="stat"><b>2026.07</b><span>資料版本</span></div></div>
</header>
<div class="toolbar"><div class="controls"><input id="q" placeholder="搜尋卡名、年份、事件"><select id="tier"><option value="">全部評級</option><option>S</option><option>A</option><option>B+</option></select><select id="group"><option value="">全部分類</option><option>GOAT Core</option><option>World Cup</option><option>Art & Design</option><option>Hidden Gem</option></select></div></div>
<main class="wrap"><section id="grid" class="grid"></section><div class="note">資料來源按鈕只帶你前往查價頁。SCI、eBay、130point、PSA 與 Google 圖片應交叉使用，避免被單一掛牌價誤導。</div></main>
<script>
const cards=[
{tier:'S',group:'GOAT Core',year:'2004-05',title:'Megacracks Messi Rookie',full:'Panini Megacracks Lionel Messi #71bis',hist:10,photo:8,design:8,rare:10,liq:8,raw:'高資產級',psa9:'高資產級',psa10:'六位數美元級',buy:'只在來源、版本與卡況完全確認後研究。',warn:1,story:'Messi 早期新秀核心之一，歷史地位無可取代，但已不是一般收藏預算範圍。',search:'2004-05 Panini Megacracks Lionel Messi 71bis'},
{tier:'S',group:'GOAT Core',year:'2022',title:'世界盃冠軍 #118',full:'2022 Panini Instant World Cup Lionel Messi #118',hist:10,photo:10,design:8,rare:5,liq:10,raw:'US$45–120',psa9:'US$100–160',psa10:'US$330–450',buy:'PSA 10 約 US$330–380 較舒服；US$450 以上不追。',story:'Messi 生涯封神事件的現代核心卡。印量高，但歷史敘事與流動性極強。',sci:'https://www.sportscardinvestor.com/cards/lionel-messi-soccer/2022-panini-instant-world-cup-base-print-run-22081-118',search:'2022 Panini Instant Messi 118'},
{tier:'A',group:'World Cup',year:'2022',title:'Golden Ball #132',full:'2022 Panini Instant World Cup Lionel Messi #132',hist:9,photo:9,design:8,rare:6,liq:8,raw:'US$30–80',psa9:'US$80–130',psa10:'US$220–310',buy:'比 #118 便宜時可收，適合作為世界盃雙卡組。',story:'記錄 Messi 獲得世界盃金球獎，個人成就敘事完整，辨識度略低於 #118。',search:'2022 Panini Instant Messi 132'},
{tier:'A',group:'Art & Design',year:'2023',title:'Fileteado Yellow Tango /150',full:'2023 Topps Argentina Fileteado Messi #20 Yellow Tango /150',hist:8,photo:9,design:10,rare:9,liq:6,raw:'US$120–180',psa9:'樣本少',psa10:'US$260–360',buy:'市場剛發現，不追單筆新高；US$260–310 再看。',warn:1,story:'阿根廷傳統 Fileteado 藝術、國家隊敘事與 /150 稀缺性結合，是近年美感代表。',search:'2023 Topps Argentina Fileteado Messi Yellow Tango 150'},
{tier:'A',group:'Art & Design',year:'2017-18',title:'Topps Chrome SP',full:'2017-18 Topps Chrome UEFA Messi #1 Celebrating SP',hist:8,photo:9,design:9,rare:8,liq:7,raw:'US$900+',psa9:'US$1,500+',psa10:'US$3,000+',buy:'高價卡，等回檔並核對是否為真正 SP 版本。',warn:1,story:'首年 Chrome UEFA 的慶祝變圖，兼具首年、SP 與經典影像。',search:'2017-18 Topps Chrome Messi Celebrating SP'},
{tier:'B+',group:'Art & Design',year:'2022-23',title:'Finest The Man',full:'2022-23 Topps Finest UEFA The Man Messi #FTM-9',hist:6,photo:8,design:10,rare:7,liq:5,raw:'US$75–110',psa9:'US$100–140',psa10:'US$150–190',buy:'Raw 低於 US$90 或 PSA 10 低於 US$170 可研究。',story:'設計辨識度非常高的現代 case-hit 風格卡，但歷史事件性弱於世界盃卡。',search:'Topps Finest The Man Messi FTM-9'},
{tier:'B+',group:'Hidden Gem',year:'2023-24',title:'Inception Legacy #35',full:'2023-24 Topps Inception UEFA Legacy Messi #35',hist:6,photo:8,design:9,rare:6,liq:5,raw:'US$30–55',psa9:'US$65–90',psa10:'樣本少',buy:'Raw 約 US$35–45 是不錯的美感型收藏價。',story:'背景色塊與人物切角有藝術卡質感，價格仍低，適合展示型收藏。',search:'Topps Inception Legacy Messi 35'},
{tier:'B+',group:'Hidden Gem',year:'2020-21',title:'Topps Chrome SP',full:'2020-21 Topps Chrome UEFA Messi #1 SP Variation',hist:7,photo:8,design:8,rare:7,liq:6,raw:'US$110–160',psa9:'US$180–240',psa10:'US$300–420',buy:'Raw US$130 左右可研究，重點檢查表面與置中。',story:'兼具 Chrome、SP 與可負擔價位，仍是中價位 Messi 變圖卡的好選擇。',search:'2020-21 Topps Chrome Messi SP Variation'}
];
const grid=document.querySelector('#grid'),q=document.querySelector('#q'),tier=document.querySelector('#tier'),group=document.querySelector('#group');
const enc=s=>encodeURIComponent(s);
function links(c){const ebay=`https://www.ebay.com/sch/i.html?_nkw=${enc(c.search)}&LH_Sold=1&LH_Complete=1`;const psa=`https://www.psacard.com/auctionprices/search?q=${enc(c.search)}`;const p130=`https://130point.com/sales/`;const img=`https://www.google.com/search?tbm=isch&q=${enc(c.search)}`;return `<div class="links">${c.sci?`<a href="${c.sci}" target="_blank">SCI 市場頁</a>`:''}<a href="${ebay}" target="_blank">eBay Sold</a><a href="${psa}" target="_blank">PSA APR</a><a href="${p130}" target="_blank">130point</a><a href="${img}" target="_blank">查看卡圖</a></div>`}
function render(){const text=q.value.trim().toLowerCase();const list=cards.filter(c=>(!tier.value||c.tier===tier.value)&&(!group.value||c.group===group.value)&&(!text||`${c.title} ${c.full} ${c.year} ${c.group}`.toLowerCase().includes(text)));document.querySelector('#count').textContent=list.length;grid.innerHTML=list.length?list.map(c=>`<article class="card"><div class="visual"><strong>${c.title}</strong></div><div class="body"><div class="row"><div><div class="year">${c.year} · ${c.group}</div><h2>${c.title}</h2><div class="full">${c.full}</div></div><span class="tier ${c.tier[0]}">${c.tier}</span></div><div class="score"><div><b>${c.hist}</b>歷史</div><div><b>${c.photo}</b>照片</div><div><b>${c.design}</b>設計</div><div><b>${c.rare}</b>稀有</div><div><b>${c.liq}</b>流動</div></div><div class="market"><div><span>RAW</span><b>${c.raw}</b></div><div><span>PSA 9</span><b>${c.psa9}</b></div><div><span>PSA 10</span><b>${c.psa10}</b></div></div><div class="advice ${c.warn?'warn':''}"><b>買入建議</b><br>${c.buy}</div><p class="story">${c.story}</p>${links(c)}</div></article>`).join(''):`<div class="empty">沒有符合條件的卡片</div>`}
[q,tier,group].forEach(x=>x.addEventListener('input',render));render();
</script>
</body>
</html>
