*{box-sizing:border-box}

button,.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 12px;font-size:14px;font-weight:800;color:var(--text);cursor:pointer;text-decoration:none;display:inline-block}
button.active,.btn.primary{background:var(--main);color:white;border-color:var(--main)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;margin-top:14px;box-shadow:0 8px 22px rgba(45,35,20,.08)}
.date{font-size:13px;font-weight:900;color:var(--main);letter-spacing:.06em}
h2{font-size:24px;line-height:1.15;margin:4px 0 8px}

.tag{display:inline-block;font-size:12px;font-weight:800;background:#f0eee8;color:#62594d;padding:5px 8px;border-radius:999px;margin:3px 4px 3px 0}
.tag.food{background:#ecf7ed;color:#3f7443}.tag.warn{background:#fff0eb;color:#9d4c39}.tag.move{background:#edf5fb;color:#3a6580}
.alert{border-left:5px solid var(--warn);background:#fff5f0;padding:10px 12px;border-radius:14px;color:#6d372c;margin:12px 0;font-size:14px}
.ok{border-left-color:#4b7f52;background:#f0f8ef;color:#315c38}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:680px){.grid{grid-template-columns:1fr}h1{font-size:36px}}
.item{display:grid;grid-template-columns:72px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.time{font-weight:900;color:var(--main);font-size:14px}
.loc{font-weight:900;font-size:16px}
.note{color:var(--muted);font-size:14px}
.trans{margin-top:5px;color:#4b6170;font-size:13px;font-weight:800}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.mini{font-size:12px;padding:7px 9px}
.map{background:var(--soft);color:#235c60;border-color:#cce6e4}
.copy{white-space:pre-wrap;background:#26221d;color:#fff7e8;border-radius:14px;padding:12px;font-family:ui-monospace,Menlo,monospace;font-size:13px;overflow:auto}

let active = "overview";

function tagHtml(tags){
 return tags.map(t=>`<span class="tag">${t}</span>`).join("");
}
function actions(map,route){
 let h = "";
 if(map) h += `<a class="btn mini map" target="_blank" href="${searchMap(map)}">地圖</a>`;
 if(route) h += `<a class="btn mini" target="_blank" href="${routeMap(route[0],route[1])}">路線</a>`;
 return h ? `<div class="actions">${h}</div>` : "";
}
function renderTabs(){
 document.getElementById("tabs").innerHTML = tabs.map(t =>
   `<button class="${active===t[0]?'active':''}" onclick="setActive('${t[0]}')">${t[1]}</button>`
 ).join("");
}
function setActive(id){
 active = id;
 render();
 window.scrollTo({top:0,behavior:"smooth"});
}

function render(){
 renderTabs();
 const c = document.getElementById("content");
 if(active==="overview") c.innerHTML = overview();
 else if(active==="maps") c.innerHTML = maps();
 else if(active==="phrases") c.innerHTML = phrases();
 else if(active==="memo") c.innerHTML = memo();
 else c.innerHTML = renderDay(days.find(d=>d.id===active));
}
render();
